{% extends "base.html" %}

{% block title %}Corrector - Laplin Atena Corrector{% endblock %}

{% block content %}
<div class="corrector-section">
    <div class="container">
        <h1>Corretor de Texto</h1>
        
        <div class="corrector-form">
            <form id="correctionForm" action="/api/correct" method="post">
                <div class="form-group">
                    <label for="inputText">Digite ou cole seu texto aqui:</label>
                    <textarea 
                        id="inputText" 
                        name="text" 
                        placeholder="Insira o texto que deseja corrigir..."
                        rows="10"
                        required
                    ></textarea>
                </div>
                
                <div class="form-options">
                    <div class="option-group">
                        <label for="language">Idioma:</label>
                        <select id="language" name="language">
                            <option value="pt">Português</option>
                            <option value="en">Inglês</option>
                            <option value="es">Espanhol</option>
                        </select>
                    </div>
                    
                    <div class="option-group">
                        <label for="correctionType">Tipo de Correção:</label>
                        <select id="correctionType" name="correction_type">
                            <option value="grammar">Gramática</option>
                            <option value="style">Estilo</option>
                            <option value="spelling">Ortografia</option>
                            <option value="all">Completa</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">Corrigir Texto</button>
            </form>
        </div>
        
        <div id="results" class="results-section" style="display: none;">
            <h2>Resultado da Correção</h2>
            <div class="result-content">
                <div class="original-text">
                    <h3>Texto Original</h3>
                    <div id="originalText"></div>
                </div>
                <div class="corrected-text">
                    <h3>Texto Corrigido</h3>
                    <div id="correctedText"></div>
                </div>
                <div class="suggestions">
                    <h3>Sugestões</h3>
                    <ul id="suggestionsList"></ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/corrector.js') }}"></script>
{% endblock %}
